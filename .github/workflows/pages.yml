name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/assets/fonts
          cp ./*.html portfolio.css site.js .nojekyll _site/
          cp assets/*.webp assets/roman-gigola-cv.pdf _site/assets/
          cp assets/favicon.svg _site/assets/
          cp assets/fonts/*.woff2 assets/fonts/fonts.css assets/fonts/OFL.txt _site/assets/fonts/
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

